<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Kingdoms - Auth System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Settings Floating Trigger Button -->
  <button id="openSettingsBtn" class="settings-trigger-btn" title="Settings">⚙️</button>

  <!-- Settings Modal Screen -->
  <div id="settingsModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 data-i18n="settingsTitle">SETTINGS</h2>
      
      <!-- Orientation Setting -->
      <div class="setting-item">
        <label data-i18n="modeLabel">Screen Mode</label>
        <div class="toggle-switch-container">
          <span data-i18n="portrait">Portrait</span>
          <label class="switch">
            <input type="checkbox" id="orientationToggle">
            <span class="slider round"></span>
          </label>
          <span data-i18n="landscape">Landscape</span>
        </div>
      </div>

      <!-- Language Setting -->
      <div class="setting-item">
        <label data-i18n="languageLabel">Language</label>
        <select id="languageSelect">
          <option value="en">English</option>
          <option value="tl">Tagalog</option>
          <option value="ru">Русский (Russian)</option>
        </select>
      </div>

      <button id="closeSettingsBtn" class="btn-action close-btn" data-i18n="close">CLOSE</button>
    </div>
  </div>

  <!-- Main Game Container Wrapper -->
  <div class="game-card" id="mainContainer">
    
    <!-- Header Logo Container -->
    <div class="logo-container">
      <div class="sub-title" data-i18n="welcomeTo">welcome to</div>
      <h1 class="game-title">WORLD KINGDOMS</h1>
      <div class="author-credit"><span data-i18n="by">by</span> <span class="author-name">MalDev</span></div>
    </div>

    <!-- Alert Message Box -->
    <div id="alertMsg" class="alert-box hidden"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail" data-i18n="emailLabel">GMAIL / EMAIL</label>
        <div class="input-wrapper">
          <input type="email" id="loginEmail" placeholder="Enter your email" required />
        </div>
      </div>
      <div class="form-group">
        <label for="loginPassword" data-i18n="passwordLabel">PASSWORD</label>
        <div class="input-wrapper">
          <input type="password" id="loginPassword" placeholder="Enter password" required />
          <span class="toggle-password">👁️</span>
        </div>
      </div>
      <button type="submit" class="btn-action">
        <span class="btn-text" data-i18n="enterRealm">ENTER REALM</span>
        <div class="btn-loader hidden">
          <span class="spinner"></span>
          <span data-i18n="pleaseWait">Please wait...</span>
        </div>
      </button>
      <div class="links-container">
        <a href="#" id="toForgot" data-i18n="forgotPass">Forgot Password?</a>
        <a href="#" id="toRegister" data-i18n="createAcc">Create Account</a>
      </div>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label for="regEmail" data-i18n="emailLabel">GMAIL / EMAIL</label>
        <div class="input-wrapper">
          <input type="email" id="regEmail" placeholder="Enter your email" required />
        </div>
      </div>
      <div class="form-group">
        <label for="regPassword" data-i18n="newPasswordLabel">NEW PASSWORD</label>
        <div class="input-wrapper">
          <input type="password" id="regPassword" placeholder="Create password" required />
          <span class="toggle-password">👁️</span>
        </div>
        <small class="help-text" data-i18n="passHelp">
          Must be at least 8 chars, 1 uppercase, 1 number & 1 special char.
        </small>
      </div>
      <div class="form-group">
        <label for="regConfirmPassword" data-i18n="confirmPasswordLabel">CONFIRM PASSWORD</label>
        <div class="input-wrapper">
          <input type="password" id="regConfirmPassword" placeholder="Confirm password" required />
          <span class="toggle-password">👁️</span>
        </div>
      </div>
      <button type="submit" class="btn-action">
        <span class="btn-text" data-i18n="createAccBtn">CREATE ACCOUNT</span>
        <div class="btn-loader hidden">
          <span class="spinner"></span>
          <span data-i18n="pleaseWait">Please wait...</span>
        </div>
      </button>
      <div class="links-container">
        <a href="#" class="toLogin" data-i18n="backToLogin">Back to Login</a>
      </div>
    </form>

    <!-- FORGOT PASSWORD FORM -->
    <form id="forgotForm" class="hidden">
      <div class="form-group">
        <label for="forgotEmail" data-i18n="yourGmailLabel">YOUR GMAIL</label>
        <div class="input-wrapper">
          <input type="email" id="forgotEmail" placeholder="Enter registered email" required />
        </div>
      </div>
      <button type="submit" class="btn-action">
        <span class="btn-text" data-i18n="resetPassBtn">RESET PASSWORD</span>
        <div class="btn-loader hidden">
          <span class="spinner"></span>
          <span data-i18n="pleaseWait">Please wait...</span>
        </div>
      </button>
      <div class="links-container">
        <a href="#" class="toLogin" data-i18n="backToLogin">Back to Login</a>
      </div>
    </form>

  </div>

  <!-- NAKA-HIWALAY NA JS FILES (Tamang pagkasunod-sunod) -->
  <script src="translations.js"></script>
  <script src="settings.js"></script>
  <script src="auth.js"></script>
  <script src="main.js"></script>

  <!-- PAGKAKASUNOD-SUNOD NG SCRIPTS -->
  <script src="translations.js"></script>
  <script src="settings.js"></script>
  <script src="auth.js"></script>
  <script src="main.js"></script>
</body>
</html>
