<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Kingdoms - Login & Registration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="game-card">
    <!-- Header Logo Container -->
    <div class="logo-container">
      <div class="sub-title">welcome to</div>
      <h1 class="game-title">WORLD KINGDOMS</h1>
      <div class="author-credit">by <span class="author-name">MalDev</span></div>
    </div>

    <!-- Alert Message Box -->
    <div id="alertMsg" class="alert-box hidden"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">GMAIL / EMAIL</label>
        <div class="input-wrapper">
          <input type="email" id="loginEmail" placeholder="Enter your email" required />
        </div>
      </div>
      <div class="form-group">
        <label for="loginPassword">PASSWORD</label>
        <div class="input-wrapper">
          <input type="password" id="loginPassword" placeholder="Enter password" required />
          <span class="toggle-password">👁️</span>
        </div>
      </div>
      <button type="submit" class="btn-action">
        <span class="btn-text">ENTER GAME</span>
        <div class="btn-loader hidden">
          <span class="spinner"></span>
          <span>Please wait...</span>
        </div>
      </button>
      <div class="links-container">
        <a href="#" id="toForgot">Forgot Password?</a>
        <a href="#" id="toRegister">Create Account</a>
      </div>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label for="regEmail">GMAIL / EMAIL</label>
        <div class="input-wrapper">
          <input type="email" id="regEmail" placeholder="Enter your email" required />
        </div>
      </div>
      
      <div class="form-group">
        <label for="regPassword">NEW PASSWORD</label>
        <div class="input-wrapper">
          <input type="password" id="regPassword" placeholder="Create password" required />
          <span class="toggle-password">👁️</span>
        </div>
        <small style="font-size: 0.68rem; color: #a8a8a8; display: block; margin-top: 4px; text-align: left;">
          At least 8 chars, 1 uppercase, 1 number & 1 special char.
        </small>
      </div>

      <!-- CONFIRM PASSWORD FIELD -->
      <div class="form-group">
        <label for="regConfirmPassword">CONFIRM PASSWORD</label>
        <div class="input-wrapper">
          <input type="password" id="regConfirmPassword" placeholder="Re-enter password" required />
          <span class="toggle-password">👁️</span>
        </div>
      </div>

      <button type="submit" class="btn-action">
        <span class="btn-text">CREATE ACCOUNT</span>
        <div class="btn-loader hidden">
          <span class="spinner"></span>
          <span>Please wait...</span>
        </div>
      </button>
      <div class="links-container">
        <a href="#" class="toLogin">Back to Login</a>
      </div>
    </form>

    <!-- FORGOT PASSWORD FORM -->
    <form id="forgotForm" class="hidden">
      <div class="form-group">
        <label for="forgotEmail">YOUR GMAIL</label>
        <div class="input-wrapper">
          <input type="email" id="forgotEmail" placeholder="Enter registered email" required />
        </div>
      </div>
      <button type="submit" class="btn-action">
        <span class="btn-text">RESET PASSWORD</span>
        <div class="btn-loader hidden">
          <span class="spinner"></span>
          <span>Please wait...</span>
        </div>
      </button>
      <div class="links-container">
        <a href="#" class="toLogin">Back to Login</a>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
